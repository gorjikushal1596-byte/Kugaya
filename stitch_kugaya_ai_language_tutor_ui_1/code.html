<!-- Interactive State Logic -->
<script>
    (function() {
      // Language Card Selection
      const langCards = document.querySelectorAll('.lang-card');
      langCards.forEach(card => {
        card.addEventListener('click', () => {
          langCards.forEach(c => {
            c.classList.remove('bg-surface-container-high');
            c.classList.add('bg-surface-container-low');
            const glow = c.querySelector('.lang-glow');
            if (glow) glow.classList.replace('opacity-100', 'opacity-0');
            const icon = c.querySelector('.lang-check');
            if (icon) {
              icon.innerText = 'radio_button_unchecked';
              icon.classList.remove('text-primary-container');
              icon.classList.add('text-outline-variant');
              icon.removeAttribute('style');
            }
            const scriptTitle = c.querySelector('.font-headline-sm');
            if (scriptTitle) {
              scriptTitle.classList.remove('text-primary');
              scriptTitle.classList.add('text-on-surface');
            }
          });

          card.classList.remove('bg-surface-container-low');
          card.classList.add('bg-surface-container-high');
          const glow = card.querySelector('.lang-glow');
          if (glow) glow.classList.replace('opacity-0', 'opacity-100');
          const icon = card.querySelector('.lang-check');
          if (icon) {
            icon.innerText = 'check_circle';
            icon.classList.remove('text-outline-variant');
            icon.classList.add('text-primary-container');
            icon.setAttribute('style', "font-variation-settings: 'FILL' 1;");
          }
          const scriptTitle = card.querySelector('.font-headline-sm');
          if (scriptTitle) {
            scriptTitle.classList.remove('text-on-surface');
            scriptTitle.classList.add('text-primary');
          }
        });
      });

      // Speaking Style Selection
      const styleCards = document.querySelectorAll('.style-card');
      styleCards.forEach(card => {
        card.addEventListener('click', () => {
          styleCards.forEach(c => {
            c.classList.remove('bg-surface-container-high');
            c.classList.add('bg-surface-container-low');
            const glow = c.querySelector('.style-glow');
            if (glow) glow.classList.replace('opacity-100', 'opacity-0');
            const radio = c.querySelector('.style-radio');
            if (radio) {
              radio.innerText = 'radio_button_unchecked';
              radio.classList.remove('text-primary-container');
              radio.classList.add('text-outline-variant');
              radio.removeAttribute('style');
            }
            const icon = c.querySelector('.style-icon');
            if (icon) {
              icon.classList.remove('text-primary-container');
              icon.classList.add('text-outline-variant');
              icon.removeAttribute('style');
            }
          });

          card.classList.remove('bg-surface-container-low');
          card.classList.add('bg-surface-container-high');
          const glow = card.querySelector('.style-glow');
          if (glow) glow.classList.replace('opacity-0', 'opacity-100');
          const radio = card.querySelector('.style-radio');
          if (radio) {
            radio.innerText = 'check_circle';
            radio.classList.remove('text-outline-variant');
            radio.classList.add('text-primary-container');
            radio.setAttribute('style', "font-variation-settings: 'FILL' 1;");
          }
          const icon = card.querySelector('.style-icon');
          if (icon) {
            icon.classList.remove('text-outline-variant');
            icon.classList.add('text-primary-container');
            icon.setAttribute('style', "font-variation-settings: 'FILL' 1;");
          }
        });
      });
    })();
